services:
  fonlu:
    build: .
    container_name: fonlu
    # Docker Desktop yeniden baslatildiginda site kendiliginden geri gelsin.
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # static/ bind mount edilince frontend duzenlemeleri yeniden build
      # gerektirmiyor (sunucu zaten Cache-Control: no-cache gonderiyor).
      - ./static:/app/static:ro
    # 'docker compose ps' konteynerin ayakta olmasini degil, sitenin gercekten
    # cevap verdigini gostersin. slim imajda curl yok, urllib yeterli.
    healthcheck:
      # /api/status artik auth istiyor; 401 de "sunucu ayakta" demek.
      # urllib 401'de HTTPError firlatiyor, onu basari sayiyoruz.
      test: ["CMD", "python", "-c",
             "import urllib.request as u,urllib.error as e\ntry: u.urlopen('http://localhost:8000/api/status')\nexcept e.HTTPError: pass"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  test-db:
    image: postgres:17
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: fonlu_test
    # Testler saniyeler suruyor; kalici volume gereksiz, tmpfs daha hizli.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  tests:
    build: .
    profiles: [test]
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:test@test-db:5432/fonlu_test
      # Testte sahte: JWT dogrulamasi override ediliyor, aga cikilmiyor.
      SUPABASE_URL: https://example.invalid
    command: python test_fonlu.py
